const GROUPS=[{id:'machine',name:'ฝ่ายเครื่องจักรกลและไฟฟ้า',list:['งานไฟฟ้าสาธารณะ','งานศูนย์เครื่องจักรกล','งานศิลป์']},{id:'infra',name:'ฝ่ายสาธารณูปโภค',list:['งานบูรณะทางและสะพาน','งานสวนสาธารณะ','งานสถานที่']}];
const MENU=[['dashboard','▦','ภาพรวมทั้งหมด'],['tasks','▤','ทะเบียนงานทั้งหมด'],['executive','▧','งานประชุมผู้บริหาร'],['community','⌂','งานติดตามชุมชน'],['outside','!','รอทบทวนหน่วยงาน'],['late','◷','งานเกินกำหนด'],['units','▣','งานแยกตามฝ่าย'],['categories','◈','หมวดหมู่การดำเนินงาน'],['reports','▥','รายงาน Word A4'],['history','↻','ประวัติการดำเนินงาน'],['sources','▤','ตารางต้นฉบับ Excel'],['backup','⤓','สำรอง / ส่งต่อเครื่อง'],['settings','⚙','ตั้งค่าระบบ']];
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
const attr=s=>esc(s);const srcName=s=>SOURCES[s]||s||'ไม่ระบุ';
const unique=(xs)=>Array.from(new Set(xs.map(x=>String(x||'').trim()).filter(Boolean))).sort((a,b)=>a.localeCompare(b,'th'));
const validDate=d=>/^\d{4}-\d{2}-\d{2}$/.test(String(d||''));
function thaiDate(d){if(!d)return '-';const iso=String(d).slice(0,10);if(!validDate(iso))return String(d);const x=iso.split('-');return `${Number(x[2])} ${['','ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'][Number(x[1])]} ${Number(x[0])+543}`}
function today(){const d=new Date(),pad=x=>String(x).padStart(2,'0');return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`}
function st(s){return STATUS.findIndex(x=>String(x).slice(0,1)===String(s||'').slice(0,1))+1 || 1}
function isDone(r){return st(r.status)===5}
function isLate(r){return !r.archived&&!isDone(r)&&Boolean(r.deadline)&&r.deadline<today()}
function textBlob(blob,filename){const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename;a.style.display='none';document.body.append(a);a.click();setTimeout(()=>{URL.revokeObjectURL(url);a.remove()},2000)}
function blobData(data,filename,type){textBlob(new Blob([data],{type:type||'application/octet-stream'}),filename)}
function toast(msg,error=false){const t=$('toast');t.textContent=msg;t.className='toast show'+(error?' error':'');clearTimeout(t._timer);t._timer=setTimeout(()=>t.className='toast',4500)}
function cloneState(){return JSON.parse(JSON.stringify(state))}
function validateState(obj){return obj&&obj.format===APP_FORMAT&&Array.isArray(obj.records)&&obj.settings&&typeof obj.settings==='object'}
function openDb(){return new Promise((resolve,reject)=>{try{const req=indexedDB.open('LCB_ENGINEERING_OFFLINE_DB',1);req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains('data'))req.result.createObjectStore('data')};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)}catch(err){reject(err)}})}
let db=null;
async function initializeStorage(){let stored=null;try{db=await openDb();stored=await new Promise((res,rej)=>{const req=db.transaction('data').objectStore('data').get('current');req.onsuccess=()=>res(req.result);req.onerror=()=>rej(req.error)});storageType='IndexedDB (ออฟไลน์)'}catch(err){db=null;storageType='LocalStorage (สำรอง)';try{stored=JSON.parse(localStorage.getItem(STORAGE_KEY)||'null')}catch(e){}}
if(validateState(stored) && (Number(stored.revision)||0)>(Number(state.revision)||0)){state=stored;toast('โหลดข้อมูลที่บันทึกไว้ในเครื่องนี้แล้ว')}else if(validateState(stored)&&(Number(stored.revision)||0)===(Number(state.revision)||0) && stored.lastSaved && (stored.lastSaved>String(state.lastSaved||''))){state=stored}
$('brandLogo').src=state.settings.logoDataUrl; await storeCurrent(false);render()}
function storeCurrent(show=true){return new Promise(async resolve=>{state.lastSaved=new Date().toISOString();if(db){try{await new Promise((res,rej)=>{const trans=db.transaction('data','readwrite');trans.objectStore('data').put(cloneState(),'current');trans.oncomplete=()=>res();trans.onerror=()=>rej(trans.error)});if(show)toast('บันทึกข้อมูลในเครื่องเรียบร้อยแล้ว');resolve(true);return}catch(err){storageType='LocalStorage (พื้นที่จัดเก็บจำกัด)';console.warn(err)}}
try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state));if(show)toast('บันทึกข้อมูลในเครื่องเรียบร้อยแล้ว');resolve(true)}catch(err){toast('บันทึกข้อมูลในเครื่องไม่สำเร็จ: พื้นที่อาจเต็ม กรุณาส่งออก HTML หรือ JSON ก่อนปิดหน้าต่าง',true);resolve(false)}})}
async function commit(action,taskId,description){state.revision=(Number(state.revision)||0)+1;state.changeLog.unshift({at:new Date().toISOString(),action,taskId,description});state.changeLog=state.changeLog.slice(0,2000);await storeCurrent();render()}
function dataActive(){return state.records.filter(r=>!r.archived)}
function getViewScope(){const records=dataActive();switch(view){case'executive':return records.filter(r=>r.source==='executive');case'community':return records.filter(r=>r.source==='community');case'outside':return records.filter(r=>r.source==='outside');case'late':return records.filter(isLate);default:return records}}
function inFilter(r){const s=filters.search.trim().toLowerCase();if(s){const hay=[r.id,r.detail,r.location,r.category,r.community,r.workUnit,r.division,r.responsible,r.proposer,r.liaison,r.notes,r.quantity,r.itemNo].join(' ').toLowerCase();if(!hay.includes(s))return false}
return (!filters.source||r.source===filters.source)&&(!filters.status||st(r.status)===Number(filters.status))&&(!filters.category||r.category===filters.category)&&(!filters.unit||r.workUnit===filters.unit)&&(!filters.community||r.community===filters.community)&&(!filters.overdue||isLate(r))}
function scoped(){return getViewScope().filter(inFilter)}
function countBy(xs,fn){const out={};xs.forEach(x=>{const k=fn(x)||'ไม่ระบุ';out[k]=(out[k]||0)+1});return Object.entries(out).sort((a,b)=>b[1]-a[1])}
function pct(n,total){return total?Math.round(n/total*100):0}
function badgeStatus(r){return `<span class="pill s${st(r.status)}">${esc(r.status||STATUS[0])}</span>${isLate(r)?'<span class="pill late">เกินกำหนด</span>':''}`}
function pageHead(title,desc,buttons=''){return `<div class="page-header"><div><div class="eyebrow">LAEM CHABANG SMART ENGINEERING</div><h1>${title}</h1><div class="subline">${desc}</div></div><div class="actions">${buttons}</div></div>`}
function btn(text,act,cls='',extra=''){return `<button type="button" class="btn ${cls}" data-act="${act}" ${extra}>${text}</button>`}
function taskRows(rows){return rows.map(r=>`<tr><td><span class="code">${esc(r.id)}</span><div class="muted small">${esc(srcName(r.source))}</div></td><td class="ellipsis"><strong>${esc(r.detail||'-')}</strong><div class="muted small">${esc(r.category||'ไม่ระบุหมวด')}</div></td><td>${esc(r.community||r.location||'-')}<div class="muted small">${esc(r.community?r.location:'')}</div></td><td>${esc(r.workUnit||r.division||'-')}<div class="muted small">${esc(r.responsible||'')}</div></td><td>${badgeStatus(r)}<div class="mini-progress"><div style="width:${Number(r.progress)||0}%"></div></div><span class="small muted">${esc(r.progress||0)}%</span></td><td>${thaiDate(r.deadline)}<div class="muted small">${r.deadline2?'รอบ 2 '+thaiDate(r.deadline2):''}</div></td><td>${btn('เปิด / แก้ไข','edit','tiny',`data-id="${attr(r.id)}"`)}</td></tr>`).join('')}
function renderNav(){const c=dataActive();NAV.innerHTML='<div class="nav-label">เมนูหลัก</div>'+MENU.map(([id,ic,txt],i)=>`${i===6||i===10?'<div class="nav-label">การบริหารระบบ</div>':''}<button type="button" data-nav="${id}" class="nav-btn ${id===view?'active':''}"><span style="font-size:18px;width:18px;text-align:center;flex:none">${ic}</span><span>${txt}</span>${['tasks','executive','community','outside','late'].includes(id)?`<span class="nav-count">${id==='tasks'?c.length:id==='executive'?c.filter(r=>r.source==='executive').length:id==='community'?c.filter(r=>r.source==='community').length:id==='outside'?c.filter(r=>r.source==='outside').length:c.filter(isLate).length}</span>`:''}</button>`).join('')}
function kpi(title,num,sub,icon,color){return `<div class="kpi" style="--k:${color};--ki:${color}13"><div class="kpi-head"><span>${title}</span><span class="kpi-icon">${icon}</span></div><div class="kpi-value">${num}</div><div class="kpi-footer">${sub}</div></div>`}
function dashboard(){const all=dataActive(),total=all.length,done=all.filter(isDone).length,late=all.filter(isLate).length,inprog=all.filter(r=>st(r.status)===2).length;const status=STATUS.map((s,i)=>({name:s,count:all.filter(r=>st(r.status)===i+1).length,color:['#4479da','#62a9ea','#eaa93d','#946ce2','#34b889'][i]}));const sectors=status.map(x=>x.count).reduce((a,b)=>a+b,0)||1;let angle=0;const stops=status.map(x=>{let begin=angle;angle+=x.count/sectors*100;return `${x.color} ${begin.toFixed(2)}% ${angle.toFixed(2)}%`}).join(',');const bySource=countBy(all,r=>srcName(r.source)),byUnit=countBy(all,r=>r.workUnit||r.category);return pageHead('ภาพรวมการดำเนินงาน','ข้อมูลทะเบียนงานจริงจาก Excel 2 ฉบับ รวมถึงงานที่บันทึกเพิ่มภายหลัง • อัปเดตตามข้อมูลที่บันทึก',btn('เพิ่มงานใหม่','new','primary')+btn('ส่งออก Word','word-dashboard'))+
`<div class="alert"><span>ⓘ</span><span><b>ข้อมูลตั้งต้น:</b> ประชุมผู้บริหาร 55 รายการ • ติดตามชุมชน 84 รายการ • รายการรอทบทวนหน่วยงาน 6 รายการ — รวม 145 รายการ โดยไม่ปะปนงานนอกส่วนการโยธากับยอดหลัก <br><b>ข้อควรทราบ:</b> ข้อมูลที่บันทึกในเครื่องนี้ไม่ซิงก์กับเครื่องอื่นโดยอัตโนมัติ ต้องใช้ปุ่ม “ส่งออก HTML พร้อมข้อมูล” เมื่อต้องการส่งต่อ</span></div>`+
`<div class="grid-kpi">${kpi('งานทั้งหมด',total,'ข้อมูลทั้งหมดในระบบ','▦','#4378de')}${kpi('ดำเนินการเสร็จ',done,`${pct(done,total)}% จากงานทั้งหมด`,'✓','#1ea175')}${kpi('กำลังดำเนินการ',inprog,'อยู่ระหว่างปฏิบัติงาน','↻','#629ce1')}${kpi('เกินกำหนด',late,'ยังไม่แล้วเสร็จและเกินวันกำหนด','◷','#d75963')}</div>`+
`<div class="two-col"><section class="panel"><div class="panel-head"><div><div class="panel-title">สถานะงานทั้งหมด</div><div class="panel-desc">สรุปสดจากข้อมูลทะเบียนงาน</div></div></div><div class="donut-row"><div class="donut" style="background:conic-gradient(${stops})"><div class="donut-center"><b>${total}</b><small>รายการ</small></div></div><div class="legend">${status.map(x=>`<div class="legenditem"><span><i class="dot" style="background:${x.color}"></i>${esc(x.name)}</span><b>${x.count} <span class="muted small">(${pct(x.count,total)}%)</span></b></div>`).join('')}</div></div></section><section class="panel"><div class="panel-head"><div><div class="panel-title">สรุปงานตามฝ่าย / หน่วยงาน</div><div class="panel-desc">หน่วยงานตามข้อมูล Excel ต้นฉบับ</div></div></div>${byUnit.slice(0,8).map(([label,n])=>`<div class="bar-line"><div class="bar-label"><span>${esc(label)}</span><b>${n} งาน</b></div><div class="bar-track"><div class="bar-fill" style="width:${pct(n,total)}%"></div></div></div>`).join('')}</section></div>`+
`<section class="panel"><div class="panel-head"><div><div class="panel-title">ทะเบียนงานแยกตามแหล่งข้อมูล</div><div class="panel-desc">คลิกที่หมวดเพื่อเปิดดูทะเบียนงานทั้งหมด</div></div></div><div class="source-cards">${[['executive','▤'],['community','⌂'],['outside','!']].map(([s,ic])=>`<div class="source-card" data-nav="${s}" role="button" tabindex="0"><span class="icon">${ic}</span><strong>${srcName(s)}</strong><small>${s==='executive'?'ประชุม 5 ตุลาคม 2569':s==='community'?'ประชุม 16 กันยายน 2569':'งานที่ต้องตรวจสอบหน่วยงาน'}</small><b>${all.filter(x=>x.source===s).length} งาน</b></div>`).join('')}</div></section>`+
`<section class="panel"><div class="panel-head"><div><div class="panel-title">รายการติดตามล่าสุด</div><div class="panel-desc">แสดง 8 รายการจากทะเบียน • คลิกแก้ไขได้ทุกโครงการ</div></div>${btn('เปิดทะเบียนทั้งหมด','goto-tasks','tiny')}</div><div class="tablebox"><table><thead><tr><th>รหัส</th><th>รายละเอียดงาน</th><th>สถานที่/ชุมชน</th><th>หน่วยงาน</th><th>สถานะ</th><th>กำหนดส่ง</th><th></th></tr></thead><tbody>${taskRows([...all].sort((a,b)=>(b.updatedAt||'').localeCompare(a.updatedAt||'')).slice(0,8))}</tbody></table></div></section>`}
function resetFilter(reRender=false){filters={search:'',source:'',status:'',category:'',unit:'',community:'',overdue:false};page=1;if(reRender)render()}
function filterBar(){const all=dataActive(),opt=(items,selected,blank)=>`<option value="">${blank}</option>`+items.map(x=>`<option value="${attr(x)}" ${selected===x?'selected':''}>${esc(x)}</option>`).join('');return `<div class="filterbar"><input class="input" id="localSearch" value="${attr(filters.search)}" placeholder="ค้นหารหัสงาน / รายละเอียด / สถานที่" aria-label="ค้นหารายการ"><select class="select" id="filterSource" aria-label="กรองแหล่งข้อมูล">${opt(Object.keys(SOURCES),filters.source,'ทุกแหล่งข้อมูล').replace(/>(executive|community|outside|new)<\/option>/g,(_,x)=>'>'+srcName(x)+'</option>')}</select><select class="select" id="filterStatus" aria-label="กรองสถานะ"><option value="">ทุกสถานะ</option>${STATUS.map((x,i)=>`<option value="${i+1}" ${Number(filters.status)===i+1?'selected':''}>${esc(x)}</option>`).join('')}</select><select class="select" id="filterCategory" aria-label="กรองหมวดงาน">${opt(unique(all.map(x=>x.category)),filters.category,'ทุกหมวดงาน')}</select><select class="select" id="filterUnit" aria-label="กรองงานที่รับผิดชอบ">${opt(unique(all.map(x=>x.workUnit)),filters.unit,'ทุกหน่วยงาน')}</select><select class="select" id="filterCommunity" aria-label="กรองชุมชน">${opt(unique(all.map(x=>x.community)),filters.community,'ทุกชุมชน')}</select>${btn('ล้างตัวกรอง','reset','tiny')}</div>`}
function tableView(){let list=scoped();const title=({tasks:'ทะเบียนงานทั้งหมด',executive:'ติดตามงานจากการประชุมผู้บริหาร',community:'ติดตามงานชุมชน',outside:'งานรอทบทวนหน่วยงาน',late:'งานเกินกำหนด'})[view]||'ทะเบียนงาน';const descriptions={executive:'ข้อมูลที่มาจากเอกสารประชุมผู้บริหาร 5 ตุลาคม 2569 • ต้นฉบับ 55 รายการ',community:'ข้อมูลการติดตามผลจากการประชุมชุมชน 16 กันยายน 2569 • ต้นฉบับ 84 รายการ',outside:'ข้อมูล 6 รายการที่แยกไว้ให้ตรวจสอบก่อนมอบหมายหน่วยงาน'};

function renderTaskModal(){if(!activeModal)return;const r=activeModal.record,isNew=!activeModal.id;let content='';if(modalTab==='details')content=`<form id="taskForm"><div class="formgrid">${fields().map(f=>inputField(r,f,isNew)).join('')}</div></form>`;else if(modalTab==='logs'){content=`<div class="alert">บันทึกความก้าวหน้าจะเก็บแยกจากรายละเอียดทะเบียนหลัก และแนบอยู่กับรายงาน Word ของแต่ละโครงการ</div><form id="logForm"><div class="formgrid"><div class="field"><label>วันที่ปฏิบัติงาน</label><input class="input" type="date" name="date" value="${today()}" required></div><div class="field"><label>สถานะใหม่</label><select class="select" name="status">${STATUS.map(x=>`<option value="${attr(x)}" ${st(x)===st(r.status)?'selected':''}>${esc(x)}</option>`).join('')}</select></div><div class="field span2"><label>รายละเอียดการดำเนินงาน</label><textarea class="textarea" required name="note" placeholder="อธิบายผลการดำเนินงาน ปัญหา หรือขั้นตอนที่ทำ"></textarea></div><div class="field"><label>ผู้บันทึก</label><input class="input" name="author" placeholder="ชื่อผู้บันทึก"></div><div class="field"><label>ความคืบหน้า (%)</label><input class="input" type="number" name="progress" min="0" max="100" value="${r.progress||0}"></div></div><div style="margin:14px 0">${btn('＋ เพิ่มบันทึกความก้าวหน้า','add-log','primary',isNew?'disabled':'')}</div></form><div class="panel-title">ประวัติบันทึก (${r.logs?.length||0})</div><div style="margin-top:15px">${r.logs?.length?r.logs.map(x=>`<div class="log-item"><div class="small">${thaiDate(x.date)} • ${esc(x.author||'ไม่ระบุผู้บันทึก')}</div><b>${esc(x.status)}</b> • ${esc(x.progress??'')}%<p class="subline">${esc(x.note)}</p></div>`).join(''):'<div class="empty">ยังไม่มีบันทึกความก้าวหน้า</div>'}</div>`}
else if(modalTab==='photos'){content=`<div class="alert">แนบรูปภาพ .jpg / .png / .webp ได้ไม่เกิน 3 MB ต่อไฟล์ รูปภาพจะถูกฝังภายในข้อมูลสำรอง HTML และ JSON เมื่อส่งออก (ไฟล์ที่มีรูปภาพมากอาจมีขนาดใหญ่)</div><div class="field"><label>เพิ่มรูปภาพหรือหลักฐานประกอบ</label><input id="photoInput" type="file" class="input" accept="image/png,image/jpeg,image/webp" multiple ${isNew?'disabled':''}></div><div class="photo-grid" style="margin-top:18px">${(r.photos||[]).map((p,i)=>`<div class="photo"><img src="${attr(p.dataUrl)}" alt="ภาพแนบรายการ ${i+1}"><small>${esc(p.name||'รูปภาพ')}</small><button type="button" data-act="delete-photo" data-index="${i}" title="ลบรูปภาพ">×</button></div>`).join('')}</div>`}
else if(modalTab==='original'){const orig=r.sourceValues||{};content=`<div class="alert"><span>ⓘ</span><span>ข้อมูลด้านล่างคือค่าจากแถวต้นฉบับก่อนแก้ไข ใช้อ้างอิงเทียบกับทะเบียนงานปัจจุบัน ข้อมูลที่บันทึกเพิ่มเติมจะไม่เขียนทับต้นฉบับที่เก็บไว้</span></div><div class="panel-title" style="margin-bottom:15px">${esc(r.sourceFile||'งานที่เพิ่มใหม่')} • ${esc(r.sourceSheet||'')} • แถว ${esc(r.sourceRow||'-')}</div>${Object.keys(orig).length?Object.entries(orig).map(([k,v])=>`<div class="row-info"><b>${esc(k)}</b><span>${esc(v)}</span></div>`).join(''):'<div class="empty">เป็นงานที่เพิ่มภายหลัง ไม่มีแถวใน Excel ต้นฉบับ</div>'}`}
MODAL.innerHTML=`<div class="modal-backdrop" id="modalBackdrop"><section class="modal" role="dialog" aria-modal="true" aria-label="รายละเอียดโครงการ"><div class="modal-header"><div><div class="eyebrow">TASK MANAGEMENT</div><h2>${isNew?'＋ เพิ่มงานใหม่':'รายการ '+esc(r.id)}</h2></div><button class="x" data-act="close" aria-label="ปิด">×</button></div><div class="modal-tabs">${[['details','✎ รายละเอียดงาน'],['logs','↻ บันทึกความก้าวหน้า'],['photos','▧ รูปภาพหลักฐาน'],['original','◷ เทียบต้นฉบับ']].map(([k,v])=>`<button type="button" class="modal-tab ${modalTab===k?'active':''}" data-tab="${k}" ${isNew&&k!=='details'?'disabled':''}>${v}</button>`).join('')}</div><div class="modal-body">${content}</div><div class="modal-footer"><div class="actions">${!isNew?btn('รายงาน Word โครงการนี้','word-one','tiny',`data-id="${attr(r.id)}"`):''}${!isNew&&r.createdByUser?btn('ลบรายการ','delete-task','danger tiny',`data-id="${attr(r.id)}"`):''}</div><div class="actions">${btn('ปิด','close')}${modalTab==='details'?btn('✓ บันทึกการแก้ไข','save-task','primary'):''}</div></div></section></div>`}
function closeModal(){activeModal=null;MODAL.innerHTML=''}
function saveTask(){if(!activeModal)return;const form=$('taskForm');if(!form||!form.reportValidity())return;const f=new FormData(form),r=activeModal.record,isNew=!activeModal.id,old=String(r.id||'');const next={...r};for(const field of fields()){let value=f.get(field[0]);if(value===null)value='';next[field[0]]=field[0]==='progress'?Number(value):String(value).trim()}
if(!next.id||!next.detail){toast('กรุณากรอกรหัสงานและรายละเอียดงาน',true);return}if(!/^[\w.\-ก-๙]+$/.test(next.id)){toast('รหัสงานใช้ตัวอักษร ตัวเลข จุด ขีด และขีดล่างเท่านั้น',true);return}if(isNew&&state.records.some(x=>x.id===next.id)){toast('มีรหัสงานนี้อยู่แล้ว กรุณาตรวจสอบรหัสซ้ำ',true);return}if(Number(next.progress)<0||Number(next.progress)>100){toast('ความคืบหน้าต้องอยู่ระหว่าง 0–100%',true);return}if(isDone(next)&&!next.doneDate){next.doneDate=today()}if(isDone(next)&&next.progress<100){if(confirm('สถานะแล้วเสร็จ แต่ความคืบหน้ายังไม่ถึง 100% ต้องการปรับเป็น 100% หรือไม่?'))next.progress=100}
next.updatedAt=new Date().toISOString();if(isNew){next.createdByUser=true;next.sourceFile='เพิ่มจาก Dashboard';state.records.unshift(next)}else{const i=state.records.findIndex(x=>x.id===old);if(i<0)return;state.records[i]=next}closeModal();commit(isNew?'เพิ่มงาน':'แก้ไขงาน',next.id,next.detail)}
function addLog(){if(!activeModal?.id)return;const form=$('logForm');if(!form||!form.reportValidity())return;const f=new FormData(form),r=state.records.find(x=>x.id===activeModal.id);if(!r)return;const log={date:String(f.get('date')||today()),status:String(f.get('status')||r.status),progress:Number(f.get('progress')||0),note:String(f.get('note')||'').trim(),author:String(f.get('author')||'').trim(),at:new Date().toISOString()};if(log.progress<0||log.progress>100){toast('เปอร์เซ็นต์ความคืบหน้าต้องอยู่ในช่วง 0–100',true);return}r.logs=r.logs||[];r.logs.unshift(log);r.status=log.status;r.progress=log.progress;if(isDone(r)){r.doneDate=r.doneDate||log.date}r.updatedAt=log.at;activeModal.record=r;commit('บันทึกความก้าวหน้า',r.id,log.note).then(()=>{renderTaskModal()})}
async function addPhotos(files){if(!activeModal?.id||!files?.length)return;const r=state.records.find(x=>x.id===activeModal.id);let ok=0;for(const file of Array.from(files)){if(!/^image\/(jpeg|png|webp)$/.test(file.type)||file.size>3*1024*1024){toast('อนุญาตเฉพาะรูปภาพ jpg/png/webp ขนาดไม่เกิน 3 MB ต่อภาพ',true);continue}const dataUrl=await new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=()=>rej(fr.error);fr.readAsDataURL(file)});r.photos=r.photos||[];r.photos.push({name:file.name,type:file.type,dataUrl,at:new Date().toISOString()});ok++}if(ok){activeModal.record=r;await commit('แนบภาพ',r.id,`เพิ่มรูปภาพ ${ok} ไฟล์`);renderTaskModal()}}
function groupClick(name,kind){view='tasks';resetFilter();if(kind==='units'){filters.unit=name==='ยังไม่ระบุหน่วยงาน'?'':name}else filters.category=name==='ยังไม่ระบุหมวด'?'':name;render()}
function wordDownload(list,kind,label){if(!list.length){toast('ไม่มีรายการสำหรับออกรายงาน',true);return}const blob=createWordReport(list,kind,label);textBlob(blob,`รายงานฝ่ายการโยธา_${kind==='individual'?'รายโครงการ_':''}${today()}.docx`);toast('สร้างและดาวน์โหลดไฟล์ Word (.docx) A4 แล้ว')}
function currentWord(){wordDownload(scoped(),'list',MENU.find(m=>m[0]===view)?.[2]||'ทะเบียนงาน')}
function excelCsvValue(v){let x=String(v??'');if(/^[\s]*[=+\-@]/.test(x))x="'"+x;return '"'+x.replace(/"/g,'""')+'"'}
const EXPORT_COLS=[['id','รหัสงาน'],['source','แหล่งข้อมูล'],['detail','รายละเอียดงาน'],['location','สถานที่'],['community','ชุมชน'],['category','หมวดงาน'],['division','ฝ่าย'],['workUnit','งานรับผิดชอบ'],['quantity','จำนวน'],['status','สถานะ'],['progress','ความคืบหน้า (%)'],['receivedDate','รับเรื่อง'],['surveyDate','สำรวจ'],['startDate','เริ่มงาน'],['doneDate','แล้วเสร็จ'],['deadline','กำหนดส่ง'],['responsible','ผู้รับผิดชอบ'],['proposer','ผู้เสนอ/โทร'],['liaison','ผู้ประสานงาน'],['inspector','ผู้ตรวจรับ'],['notes','หมายเหตุ']];
function downloadCsv(list){const lines=[EXPORT_COLS.map(x=>excelCsvValue(x[1])).join(',')];for(const r of list)lines.push(EXPORT_COLS.map(([k])=>excelCsvValue(r[k])).join(','));blobData('\ufeff'+lines.join('\r\n'),`ทะเบียนงานฝ่ายการโยธา_${today()}.csv`,'text/csv;charset=utf-8')}
function exportJson(){const json=JSON.stringify(state,null,2);blobData(json,`สำรองข้อมูลฝ่ายการโยธา_${today()}.json`,'application/json;charset=utf-8');toast('ส่งออกไฟล์ JSON พร้อมข้อมูลครบแล้ว')}
function exportHtml(){try{const obj=cloneState();const raw=JSON.stringify(obj).replace(/</g,'\\u003c').replace(/>/g,'\\u003e').replace(/&/g,'\\u0026');let html='<!DOCTYPE html>\n'+document.documentElement.outerHTML;const expression=/(<script\s+id="embedded-data"\s+type="application\/json">)[\s\S]*?(<\/script>)/;if(!expression.test(html))throw new Error('ไม่พบส่วนข้อมูลในไฟล์');html=html.replace(expression,(_,a,b)=>a+raw+b);blobData(html,`สำนักช่าง_แหลมฉบัง_พร้อมข้อมูล_${today()}.html`,'text/html;charset=utf-8');toast('ส่งออก HTML พร้อมข้อมูลทั้งหมดแล้ว สามารถส่งไปเปิดที่เครื่องอื่นได้')}catch(e){console.error(e);toast('ส่งออก HTML ไม่สำเร็จ: '+e.message,true)}}
function chooseImport(){let x=document.createElement('input');x.type='file';x.accept='.json,.html,application/json,text/html';x.onchange=async()=>{const file=x.files?.[0];if(!file)return;try{const content=await file.text();let incoming=null;if(file.name.toLowerCase().endsWith('.html')){const doc=new DOMParser().parseFromString(content,'text/html'),s=doc.getElementById('embedded-data');if(!s)throw new Error('ไฟล์ HTML นี้ไม่ใช่ไฟล์สำรองของระบบ');incoming=JSON.parse(s.textContent)}else incoming=JSON.parse(content);if(!validateState(incoming))throw new Error('รูปแบบไฟล์สำรองไม่ถูกต้อง');const ids=incoming.records.map(r=>r.id);if(new Set(ids).size!==ids.length)throw new Error('รหัสงานในไฟล์สำรองซ้ำกัน');if(!confirm(`ต้องการนำเข้าข้อมูล ${incoming.records.length} รายการจาก ${file.name} หรือไม่? การดำเนินการนี้จะแทนที่ทะเบียนงานในระบบเครื่องนี้ กรุณาสำรองไฟล์เก่าก่อน`))return;state=incoming;state.revision=(Number(state.revision)||0)+1;$('brandLogo').src=state.settings.logoDataUrl;await storeCurrent();resetFilter();navigate('dashboard');toast('นำเข้าข้อมูลสำเร็จ '+state.records.length+' รายการ')}catch(err){toast('นำเข้าไม่สำเร็จ: '+err.message,true)}};x.click()}
function saveSettings(){const f=$('settingsForm');if(!f||!f.reportValidity())return;let data=new FormData(f),prev={...state.settings};for(let [key] of data)state.settings[key]=String(data.get(key)||'').trim();for(const r of state.records){if(!r.createdByUser){if(r.source==='executive'&&r.deadline===prev.deadlineExecutive)r.deadline=state.settings.deadlineExecutive;if(r.source==='community'&&r.deadline===prev.deadlineCommunity1)r.deadline=state.settings.deadlineCommunity1;if(r.source==='community'&&r.deadline2===prev.deadlineCommunity2)r.deadline2=state.settings.deadlineCommunity2}}commit('ตั้งค่า','ระบบ','แก้ไขข้อมูลหน่วยงาน / การลงนาม / วันกำหนดส่ง')}
function handleAction(el){const a=el.dataset.act,id=el.dataset.id;switch(a){case'new':openTask();break;case'edit':openTask(id);break;case'close':closeModal();break;case'save-task':saveTask();break;case'add-log':addLog();break;case'delete-photo':{if(!activeModal?.id)return;const r=state.records.find(x=>x.id===activeModal.id);r.photos.splice(Number(el.dataset.index),1);activeModal.record=r;commit('ลบรูป',r.id,'ลบภาพหลักฐาน').then(renderTaskModal);break}
case'delete-task':{const r=state.records.find(x=>x.id===id);if(!r||!r.createdByUser)return;if(confirm(`ยืนยันย้ายงาน ${id} ไปยังรายการยกเลิก?`)){r.archived=true;closeModal();commit('ยกเลิกงาน',id,r.detail)}break}
case'reset':resetFilter(true);break;case'prev':page--;render();break;case'next':page++;render();break;case'goto-tasks':navigate('tasks');break;case'word-dashboard':wordDownload(dataActive(),'list','สรุปภาพรวมการดำเนินงาน');break;case'word-current':currentWord();break;case'word-one':{let r=state.records.find(x=>x.id===id);if(r)wordDownload([r],'individual','รายงานประจำโครงการ');break}
case'word-preset':{const p=el.dataset.preset,all=dataActive(),list=p==='all'?all:p==='late'?all.filter(isLate):p==='done'?all.filter(isDone):all.filter(r=>r.source===p);wordDownload(list,'list','รายงาน'+(p==='all'?'ทั้งหมด':p==='late'?'งานเกินกำหนด':p==='done'?'งานแล้วเสร็จ':srcName(p)));break}
case'backup':exportJson();break;case'export-html':exportHtml();break;case'import':chooseImport();break;case'save':storeCurrent();break;case'csv-current':downloadCsv(scoped());break;case'csv-all':downloadCsv(dataActive());break;case'csv-history':blobData('\ufeff'+[['วันที่','การดำเนินงาน','รหัส','รายละเอียด'].map(excelCsvValue).join(','),...(state.changeLog||[]).map(x=>[x.at,x.action,x.taskId,x.description].map(excelCsvValue).join(','))].join('\r\n'),'ประวัติการดำเนินงาน.csv','text/csv;charset=utf-8');break;case'save-settings':saveSettings();break;case'open-group':groupClick(el.dataset.group,el.dataset.kind);break;default:break}}
document.addEventListener('click',e=>{const tab=e.target.closest('[data-tab]');if(tab){modalTab=tab.dataset.tab;renderTaskModal();return}const nav=e.target.closest('[data-nav]');if(nav){navigate(nav.dataset.nav);return}const el=e.target.closest('[data-act]');if(el){e.preventDefault();e.stopPropagation();handleAction(el);return}const gr=e.target.closest('[data-group]');if(gr)groupClick(gr.dataset.group,gr.dataset.kind);if(e.target.id==='modalBackdrop')closeModal()});

function wCell(s,width,bold=false){return `<w:tc><w:tcPr><w:tcW w:w="${width}" w:type="dxa"/><w:vAlign w:val="center"/></w:tcPr>${wParagraph(s,{bold,after:45})}</w:tc>`}
function wTable(headers, rows, widths){const bdr='<w:tblBorders><w:top w:val="single" w:sz="4" w:color="CAD5E3"/><w:left w:val="single" w:sz="4" w:color="CAD5E3"/><w:bottom w:val="single" w:sz="4" w:color="CAD5E3"/><w:right w:val="single" w:sz="4" w:color="CAD5E3"/><w:insideH w:val="single" w:sz="4" w:color="E1E8F0"/><w:insideV w:val="single" w:sz="4" w:color="E1E8F0"/></w:tblBorders>';
 let s=`<w:tbl><w:tblPr><w:tblW w:w="0" w:type="auto"/><w:tblLayout w:type="fixed"/>${bdr}<w:tblCellMar><w:top w:w="80" w:type="dxa"/><w:left w:w="90" w:type="dxa"/><w:bottom w:w="80" w:type="dxa"/><w:right w:w="90" w:type="dxa"/></w:tblCellMar></w:tblPr><w:tblGrid>${widths.map(w=>`<w:gridCol w:w="${w}"/>`).join('')}</w:tblGrid>`;
 s+=`<w:tr><w:trPr><w:tblHeader/><w:cantSplit/></w:trPr>${headers.map((h,i)=>wCell(h,widths[i],true)).join('')}</w:tr>`;
 for(const row of rows)s+=`<w:tr><w:trPr><w:cantSplit/></w:trPr>${row.map((value,i)=>wCell(value,widths[i]||1200)).join('')}</w:tr>`;
 return s+'</w:tbl>';
}
function crc32(bytes){let crc=-1;for(const b of bytes){crc^=b;for(let i=0;i<8;i++)crc=(crc>>>1)^((crc&1)?0xEDB88320:0)}return(crc^(-1))>>>0}
function zipPack(entries){const te=new TextEncoder();const parts=[],cent=[];let offset=0;const now=new Date();const t=((now.getHours()&31)<<11)|((now.getMinutes()&63)<<5)|((now.getSeconds()/2)&31);const d=(((Math.max(now.getFullYear(),1980)-1980)&127)<<9)|(((now.getMonth()+1)&15)<<5)|(now.getDate()&31);
 for(const [filename,content] of entries){const name=te.encode(filename),data=typeof content==='string'?te.encode(content):content,crc=crc32(data);const lh=new Uint8Array(30+name.length);const v=new DataView(lh.buffer);v.setUint32(0,0x04034b50,true);v.setUint16(4,20,true);v.setUint16(6,0x0800,true);v.setUint16(8,0,true);v.setUint16(10,t,true);v.setUint16(12,d,true);v.setUint32(14,crc,true);v.setUint32(18,data.length,true);v.setUint32(22,data.length,true);v.setUint16(26,name.length,true);lh.set(name,30);parts.push(lh,data);
 const ch=new Uint8Array(46+name.length);const c=new DataView(ch.buffer);c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(8,0x0800,true);c.setUint16(10,0,true);c.setUint16(12,t,true);c.setUint16(14,d,true);c.setUint32(16,crc,true);c.setUint32(20,data.length,true);c.setUint32(24,data.length,true);c.setUint16(28,name.length,true);c.setUint32(42,offset,true);ch.set(name,46);cent.push(ch);offset+=lh.length+data.length;
 }
 const centralLength=cent.reduce((x,a)=>x+a.length,0),e=new Uint8Array(22),v=new DataView(e.buffer);v.setUint32(0,0x06054b50,true);v.setUint16(8,entries.length,true);v.setUint16(10,entries.length,true);v.setUint32(12,centralLength,true);v.setUint32(16,offset,true);return new Blob([...parts,...cent,e],{type:DOCTYPE})}
function decodeBase64Data(dataUrl){const content=String(dataUrl||'').split(',')[1]||'';const b=atob(content);const bytes=new Uint8Array(b.length);for(let i=0;i<b.length;i++)bytes[i]=b.charCodeAt(i);return bytes}

 const list=tasks.filter(r=>!r.archived);const completed=list.filter(r=>String(r.status).startsWith('5')).length;const late=list.filter(isLate).length;

 if(kind==='individual' && list.length){for(const r of list){body+=wParagraph('รหัสงาน: '+r.id,{bold:true,before:210,after:90});const fields=[['แหล่งที่มา',srcName(r.source)],['รายละเอียดงาน',r.detail],['สถานที่',r.location],['ชุมชน',r.community],['จำนวน',r.quantity],['หมวดงาน',r.category],['ฝ่าย / งานรับผิดชอบ',(r.division||'-')+' / '+(r.workUnit||'-')],['ผู้เสนอ / ผู้ประสานงาน',(r.proposer||'')+' / '+(r.liaison||'')],['วันที่รับเรื่อง',thaiDate(r.receivedDate)],['วันที่สำรวจ',thaiDate(r.surveyDate)],['วันที่เริ่มงาน',thaiDate(r.startDate)],['สถานะ',r.status],['ความก้าวหน้า',r.progress+'%'],['ผู้รับผิดชอบ',r.responsible],['วันที่แล้วเสร็จ',thaiDate(r.doneDate)],['ผู้ตรวจรับ',r.inspector],['หมายเหตุ / ปัญหาอุปสรรค',r.notes],['เหตุที่แยก',r.exclusionReason]];body+=wTable(['รายการ','ข้อมูล'],fields.filter(x=>x[1]&&x[1]!=='-'),[2350,6600]);if(r.logs?.length){body+=wParagraph('บันทึกความก้าวหน้า',{bold:true,before:180});body+=wTable(['วันที่','สถานะ','รายละเอียด','ผู้บันทึก'],r.logs.map(x=>[thaiDate(x.date),x.status||'',x.note||'',x.author||'']),[1550,1800,4100,1500])}}}
 else {body+=wordTaskTable(list);body+=wParagraph('หมายเหตุ: สรุปจากข้อมูลทะเบียนงานที่มีการบันทึกในระบบ ณ วันที่พิมพ์รายงาน',{before:150})}
 const s=state.settings;body+=wParagraph('',{before:340});body+=wTable(['ผู้จัดทำรายงาน','ผู้ตรวจสอบ','ผู้อนุมัติ / ผู้บังคับบัญชา'],[[`ลงชื่อ ........................................\n(${s.reportPreparedBy||'.........................................'})`,`ลงชื่อ ........................................\n(${s.reportReviewedBy||'.........................................'})`,`ลงชื่อ ........................................\n(${s.reportApprovedBy||'.........................................'})`]], [2980,2980,2990]);
 const document=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" xmlns:wp="http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing" xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture"><w:body>${body}<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="850" w:right="1150" w:bottom="1134" w:left="1450" w:header="600" w:footer="600"/><w:cols w:space="425"/><w:docGrid w:linePitch="360"/></w:sectPr></w:body></w:document>`;
 const styles=`<?xml version="1.0" encoding="UTF-8"?><w:styles xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:docDefaults><w:rPrDefault><w:rPr><w:rFonts w:ascii="TH Sarabun New" w:hAnsi="TH Sarabun New" w:eastAsia="TH Sarabun New" w:cs="TH Sarabun New"/><w:sz w:val="32"/><w:szCs w:val="32"/></w:rPr></w:rPrDefault></w:docDefaults><w:style w:type="paragraph" w:default="1" w:styleId="Normal"><w:name w:val="Normal"/><w:pPr><w:spacing w:after="100" w:line="310" w:lineRule="auto"/></w:pPr></w:style></w:styles>`;
 const entries=[['[Content_Types].xml',`<?xml version="1.0" encoding="UTF-8"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Default Extension="png" ContentType="image/png"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/><Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/><Override PartName="/docProps/core.xml" ContentType="application/vnd.openxmlformats-package.core-properties+xml"/><Override PartName="/docProps/app.xml" ContentType="application/vnd.openxmlformats-officedocument.extended-properties+xml"/></Types>`],['_rels/.rels',`<?xml version="1.0" encoding="UTF-8"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/package/2006/relationships/metadata/core-properties" Target="docProps/core.xml"/></Relationships>`],['word/_rels/document.xml.rels',`<?xml version="1.0" encoding="UTF-8"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="media/logo.png"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`],['word/document.xml',document],['word/styles.xml',styles],['docProps/core.xml',`<?xml version="1.0" encoding="UTF-8"?><cp:coreProperties xmlns:cp="http://schemas.openxmlformats.org/package/2006/metadata/core-properties" xmlns:dc="http://purl.org/dc/elemen
